name: Build and verify Sonora
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:palette
      - run: npm run test:playlists
      - run: npm run pack:mac
      - run: npm run test:package
      - name: Verify packaged macOS application
        run: test -x "release/mac-arm64/Sonora Music.app/Contents/MacOS/Sonora Music"
